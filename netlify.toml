[build]
  publish = "."

# Long-term caching for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Always revalidate the page itself so edits show up immediately
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Any unknown URL goes back to the invitation
[[redirects]]
  from = "/thesacredgarden"
  to = "/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/"
  status = 302
